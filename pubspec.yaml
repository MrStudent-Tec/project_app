name: proyecto_u
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  table_calendar: ^3.0.8  # Paquete para el calendario
  intl: ^0.18.1  # Paquete para el formateo de fechas
  cupertino_icons: ^1.0.6
